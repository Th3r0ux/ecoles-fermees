<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialiser le mot de passe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>Réinitialiser le mot de passe</h2>

<div id="requestBox">
  <p>Entrez votre courriel pour recevoir un lien.</p>
  <input id="email" type="email" placeholder="Votre courriel">
  <button id="send">Envoyer le lien</button>
  <p id="msg"></p>
</div>

<div id="resetBox" style="display:none;">
  <p>Nouveau mot de passe :</p>
  <input id="newPassword" type="password" placeholder="Nouveau mot de passe">
  <button id="save">Enregistrer</button>
  <p id="msg2"></p>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient("TON_URL", "TON_KEY");

const emailInput = document.getElementById("email");
const msg = document.getElementById("msg");
const resetBox = document.getElementById("resetBox");
const requestBox = document.getElementById("requestBox");

document.getElementById("send").onclick = async () => {
  const email = emailInput.value.trim();

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: "https://th3r0ux.github.io/ecoles-fermees/reset-password.html"
  });

  msg.textContent = "Si un compte existe, un lien a été envoyé.";
};

const hash = window.location.hash;

if (hash.includes("type=recovery")) {
  requestBox.style.display = "none";
  resetBox.style.display = "block";
}

document.getElementById("save").onclick = async () => {
  const password = document.getElementById("newPassword").value;

  const { error } = await supabase.auth.updateUser({ password });

  document.getElementById("msg2").textContent =
    error ? error.message : "Mot de passe mis à jour.";
};
</script>

</body>
</html>
