<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Réinitialiser le mot de passe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h2>Réinitialiser le mot de passe</h2>

  <div id="requestBox">
    <p>Entrez votre courriel pour recevoir un lien de réinitialisation.</p>

    <input
      id="email"
      type="email"
      placeholder="Votre courriel"
      style="display:block;margin:8px 0;padding:10px;width:320px;"
    >

    <button id="sendBtn" type="button" style="padding:10px 14px;">Envoyer le lien</button>

    <p id="requestMsg" style="margin-top:10px;"></p>

    <p style="margin-top:18px;">
      <a href="admin.html">Retour à la connexion</a>
    </p>
  </div>

  <div id="resetBox" style="display:none;">
    <p>Entrez votre nouveau mot de passe.</p>

    <input
      id="newPassword"
      type="password"
      placeholder="Nouveau mot de passe"
      style="display:block;margin:8px 0;padding:10px;width:320px;"
    >

    <button id="saveBtn" type="button" style="padding:10px 14px;">Enregistrer</button>

    <p id="resetMsg" style="margin-top:10px;"></p>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://djcexcxyxtfazejhstcn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TChgyvE4kQSVxpoPUUWZlA_5RYkPzM3";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        storage: window.localStorage,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const requestBox = document.getElementById("requestBox");
    const resetBox = document.getElementById("resetBox");

    const emailInput = document.getElementById("email");
    const sendBtn = document.getElementById("sendBtn");
    const requestMsg = document.getElementById("requestMsg");

    const newPassword = document.getElementById("newPassword");
    const saveBtn = document.getElementById("saveBtn");
    const resetMsg = document.getElementById("resetMsg");

    let isPasswordRecovery = false;

    function showRequestBox() {
      requestBox.style.display = "block";
      resetBox.style.display = "none";
    }

    function showResetBox() {
      requestBox.style.display = "none";
      resetBox.style.display = "block";
    }

    supabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        isPasswordRecovery = true;
        showResetBox();
      }
    });

    async function initPage() {
      const { data: { session } } = await supabase.auth.getSession();

      if (session && isPasswordRecovery) {
        showResetBox();
        return;
      }

      showRequestBox();
    }

    async function isAllowedResetEmail(email) {
  const normalizedEmail = (email || "").trim().toLowerCase();

  if (!normalizedEmail) return false;

  const { data, error } = await supabase
    .from("admin_access")
    .select("email, is_active")
    .eq("email", normalizedEmail)
    .maybeSingle();

  if (error) {
    console.error("Erreur admin_access:", error);
    return false;
  }

  return data?.is_active === true;
}
    
sendBtn.addEventListener("click", async () => {
  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    requestMsg.textContent = "Veuillez entrer votre courriel.";
    requestMsg.style.color = "#b00";
    return;
  }

  sendBtn.disabled = true;
  requestMsg.textContent = "Envoi en cours...";
  requestMsg.style.color = "#444";

  const allowed = await isAllowedResetEmail(email);

  if (!allowed) {
    sendBtn.disabled = false;
    requestMsg.textContent = "Si un compte autorisé existe pour ce courriel, un lien a été envoyé.";
    requestMsg.style.color = "#2e7d32";
    return;
  }

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: "https://th3r0ux.github.io/ecoles-fermees/reset-password.html"
  });

  sendBtn.disabled = false;

  if (error) {
    if ((error.message || "").toLowerCase().includes("rate limit")) {
      requestMsg.textContent = "Trop de demandes en peu de temps. Réessayez dans quelques minutes.";
      requestMsg.style.color = "#b00";
      return;
    }

    requestMsg.textContent = "Si un compte autorisé existe pour ce courriel, un lien a été envoyé.";
    requestMsg.style.color = "#2e7d32";
    return;
  }

  requestMsg.textContent = "Si un compte autorisé existe pour ce courriel, un lien a été envoyé.";
  requestMsg.style.color = "#2e7d32";
});

    saveBtn.addEventListener("click", async () => {
      const password = newPassword.value.trim();

      if (password.length < 8) {
        resetMsg.textContent = "Le mot de passe doit contenir au moins 8 caractères.";
        resetMsg.style.color = "#b00";
        return;
      }

      saveBtn.disabled = true;
      resetMsg.textContent = "Enregistrement en cours...";
      resetMsg.style.color = "#444";

      const { error } = await supabase.auth.updateUser({ password });

      saveBtn.disabled = false;

      if (error) {
        resetMsg.textContent = "Erreur : " + error.message;
        resetMsg.style.color = "#b00";
        return;
      }

      resetMsg.textContent = "Mot de passe mis à jour. Redirection...";
      resetMsg.style.color = "#2e7d32";

      newPassword.value = "";
      isPasswordRecovery = false;

      window.history.replaceState({}, document.title, window.location.pathname);

      setTimeout(() => {
        window.location.href = "admin.html";
      }, 1000);
    });

    initPage();
  </script>
</body>
</html>
